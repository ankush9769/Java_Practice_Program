<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>second</h1>
    <h1 id="heading1">1</h1>

    <script>
      let count = 1;
      setInterval(() => {
        ++count;
        if (count >= 10) {
          document.getElementById("heading1").innerHTML = 10 + " compleeted";
        } else {
          document.getElementById("heading1").innerHTML = count;
        }
      }, 1000);
    </script>
  </body>
</html>
