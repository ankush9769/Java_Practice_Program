<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

<body><!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

</head>
<body>
<div th:if="${name}">
    <h3 style="color: green" th:text="${name}"></h3>
</div>
<div th:if="${failed}">
    <h3 style="color: red" th:text="${failed}"></h3>
</div>

<form th:action="@{/authorize}"
      th:object="${users}" method="post">
    <input type="email" th:field="*{email}" placeholder="Enter the email">
    <br> <br>
    <input type="password" th:field="*{password}" placeholder="Enter the password">
    <br> <br>


    <input type="submit" value="Login">



</form>
<br> <br>
</body>

</html>
