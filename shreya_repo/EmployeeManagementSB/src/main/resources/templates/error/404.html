<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>404 - Employee Not Found</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: #343a40;
            color: white;
            padding: 18px 50px;
        }

        .navbar h2 {
            margin: 0;
        }

        .error-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .error-box {
            width: 500px;
            max-width: 100%;
            background-color: white;
            padding: 45px;
            border-radius: 10px;
            text-align: center;
        }

        .error-code {
            font-size: 80px;
            font-weight: bold;
            color: #dc3545;
            margin: 0;
        }

        .error-title {
            font-size: 28px;
            margin: 15px 0;
            color: #343a40;
        }

        .error-message {
            color: #6c757d;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #0056b3;
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">
    <h2>Employee Management System</h2>
</div>


<!-- ERROR CONTENT -->

<div class="error-container">

    <div class="error-box">

        <h1 class="error-code">
            404
        </h1>

        <h2 class="error-title">
            Employee Not Found
        </h2>

        <p class="error-message"
           th:text="${errorMessage}">

            The employee you are looking for does not exist.

        </p>

        <a th:href="@{/employees/showEmployees}"
           class="btn">

            ← Back to Employee List

        </a>

    </div>

</div>

</body>
</html>
