<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .navbar {
            background-color: #343a40;
            color: white;
            padding: 18px 50px;
        }

        .navbar h2 {
            margin: 0;
        }

        .container {
            width: 90%;
            margin: 40px auto;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            display: inline-block;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-success {
            background-color: #28a745;
            color: white;
        }

        .btn-warning {
            background-color: #ffc107;
            color: black;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box input {
            width: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #343a40;
            color: white;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .status-active {
            color: green;
            font-weight: bold;
        }

        .status-inactive {
            color: red;
            font-weight: bold;
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            background-color: #d4edda;
            color: #155724;
        }

        .actions {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .delete-form {
            display: inline;
            margin: 0;
        }

    </style>
</head>

<body>

<div class="navbar">
    <h2>Employee Management System</h2>
</div>


<div class="container">

    <!-- SUCCESS MESSAGE -->
    <div class="alert"
         th:if="${successMessage}"
         th:text="${successMessage}">
    </div>


    <div class="top-section">

        <h2>Employee List</h2>

        <a th:href="@{/employees/new}"
           class="btn btn-success">
            + Add Employee
        </a>

    </div>


    <!-- SEARCH FORM -->
    <form th:action="@{/employees/showEmployees}"
          method="get"
          class="search-box">

        <input type="text"
               name="keyword"
               th:value="${keyword}"
               placeholder="Search by first or last name">

        <button type="submit"
                class="btn btn-primary">
            Search
        </button>

        <a th:href="@{/employees/showEmployees}"
           class="btn btn-secondary">
            Clear
        </a>

    </form>


    <!-- EMPLOYEE TABLE -->
    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Designation</th>
            <th>Salary</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>


        <tbody>

        <tr th:each="employee : ${employees}">

            <td th:text="${employee.id}"></td>

            <td th:text="${employee.firstName}"></td>

            <td th:text="${employee.lastName}"></td>

            <td th:text="${employee.email}"></td>

            <td th:text="${employee.department}"></td>

            <td th:text="${employee.designation}"></td>

            <td th:text="${employee.salary}"></td>


            <!-- STATUS -->
            <td>

                <span th:if="${employee.active}"
                      class="status-active">
                    Active
                </span>

                <span th:unless="${employee.active}"
                      class="status-inactive">
                    Inactive
                </span>

            </td>


            <!-- ACTIONS -->
            <td>

                <div class="actions">

                    <a th:href="@{/employees/view/{id}(id=${employee.id})}"
                       class="btn btn-primary">
                        View
                    </a>


                    <a th:href="@{/employees/edit/{id}(id=${employee.id})}"
                       class="btn btn-warning">
                        Edit
                    </a>


                    <form th:action="@{/employees/delete/{id}(id=${employee.id})}"
                          method="post"
                          class="delete-form">

                        <button type="submit"
                                class="btn btn-danger"
                                onclick="return confirm('Are you sure you want to delete this employee?')">

                            Delete

                        </button>

                    </form>

                </div>

            </td>

        </tr>


        <!-- WHEN NO EMPLOYEE EXISTS -->
        <tr th:if="${#lists.isEmpty(employees)}">

            <td colspan="9"
                style="text-align: center;">

                No employees found

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
