spring.application.name=jwt-auth-demo
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/jwtauth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Replace this with a long random secret in real deployments.
# This sample is intentionally long enough for HS256.
jwt.secret=change-this-development-secret-key-to-a-long-random-value-123456789
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Angular development origin
app.cors.allowed-origin=http://localhost:4200
